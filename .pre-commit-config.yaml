# 도구 버전은 uv.lock · pnpm-lock.yaml을 따른다 (make setup이 설치)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project services/api ruff check --fix
        language: system
        files: ^services/api/
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --project services/api ruff format
        language: system
        files: ^services/api/
        types_or: [python, pyi]
      - id: prettier
        name: prettier
        entry: apps/web/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^apps/web/
        exclude: ^apps/web/pnpm-lock\.yaml$
