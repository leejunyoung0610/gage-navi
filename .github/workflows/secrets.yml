# 비밀 값 커밋 방지 (docs/50 §8 `gitleaks`, docs/01 §6, ADR-029). PR과 push 모두에서 전체 커밋 기록을 검사한다.
name: secrets

on:
  pull_request:
  push:

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # 공식 릴리스의 gitleaks_8.30.1_checksums.txt에 있는 linux_x64 값
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 기록을 검사한다
      - name: gitleaks 설치 (버전·체크섬 고정)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: 전체 기록 검사 (찾은 값은 가린다)
        run: gitleaks git --redact --no-banner --exit-code 1 .
